name: Build AppleIMX APK
on:
  push:
    branches: [main]
    paths:
      - 'apple-imx-android/**'
      - '.github/workflows/apple-imx-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - name: Install Android 35 platform if needed
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: apple-imx-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Save installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleIMX-V28-Android-APK
          path: apple-imx-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        run: |
          mkdir -p apple-imx-download
          cp apple-imx-android/app/build/outputs/apk/debug/app-debug.apk apple-imx-download/AppleIMX_V28.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-imx-download/AppleIMX_V28.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish AppleIMX V28 Android APK"
            git push
          fi
