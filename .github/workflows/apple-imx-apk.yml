name: Build AppleIMX APK
on:
  push:
    branches: [main]
    paths:
      - 'apple-imx-android/**'
      - '.github/workflows/apple-imx-apk.yml'
  workflow_dispatch:

concurrency:
  group: apple-imx-android-current
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build installable Android APK
        working-directory: apple-imx-android
        run: |
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleIMX-V35-Android-APK
          path: apple-imx-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        run: |
          mkdir -p apple-imx-download
          cp apple-imx-android/app/build/outputs/apk/debug/app-debug.apk apple-imx-download/AppleIMX_V35.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-imx-download/AppleIMX_V35.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish AppleIMX V35 Android APK"
            git pull --rebase origin main
            git push
          fi
